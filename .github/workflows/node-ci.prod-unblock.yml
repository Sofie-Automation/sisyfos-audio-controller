#######################################################################################################################
#
#   Prod Release
#
#   Manual workflow_dispatch from main. Computes CalVer (YY.MM.N), updates CHANGELOG, tags, builds,
#   publishes GitHub Release and GHCR container image.
#
#######################################################################################################################
name: Prod Node CI

permissions:
    contents: write
    packages: write
    id-token: write

env:
    node-version: 24
    yarn-version: 4.1.0

on:
    workflow_dispatch:

jobs:
    cache-dependencies:
        runs-on: ubuntu-latest
        steps:
            - name: Access repository
              uses: actions/checkout@v4
              with:
                  ref: main
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node-version }}

            - name: Enable Corepack
              run: corepack enable

            - name: Set Yarn Version
              run: corepack prepare yarn@${{ env.yarn-version }} --activate

            - name: Get Yarn cache directory
              id: yarn-cache-dir
              run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

            - name: Cache Yarn dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ steps.yarn-cache-dir.outputs.dir }}
                      .yarn/cache
                      .yarn/patches
                      .yarn/plugins
                      .yarn/releases
                      .yarn/sdks
                      .yarn/versions
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Update Lockfile
              run: yarn install --mode=update-lockfile

            - name: Install dependencies
              run: yarn install --mode=skip-build

    prebuild:
        runs-on: ubuntu-latest
        needs: cache-dependencies
        steps:
            - name: Access repository
              uses: actions/checkout@v4
              with:
                  ref: main

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node-version }}

            - name: Enable Corepack
              run: corepack enable

            - name: Set Yarn Version
              run: corepack prepare yarn@${{ env.yarn-version }} --activate

            - name: Get Yarn cache directory
              id: yarn-cache-dir
              run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

            - name: Cache Yarn dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ steps.yarn-cache-dir.outputs.dir }}
                      .yarn/cache
                      .yarn/patches
                      .yarn/plugins
                      .yarn/releases
                      .yarn/sdks
                      .yarn/versions
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Update Lockfile
              run: yarn install --mode=update-lockfile

            - name: Install dependencies
              run: yarn install --mode=skip-build

            - name: Build
              run: yarn build

    test:
        runs-on: ubuntu-latest
        needs: cache-dependencies
        steps:
            - name: Access repository
              uses: actions/checkout@v4
              with:
                  ref: main

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node-version }}

            - name: Enable Corepack
              run: corepack enable

            - name: Set Yarn Version
              run: corepack prepare yarn@${{ env.yarn-version }} --activate

            - uses: ./.github/actions/test

    validate-dependencies:
        runs-on: ubuntu-latest
        steps:
            - name: Access repository
              uses: actions/checkout@v4
              with:
                  ref: main

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node-version }}

            - name: Enable Corepack
              run: corepack enable

            - name: Set Yarn Version
              run: corepack prepare yarn@${{ env.yarn-version }} --activate

            - uses: ./.github/actions/validate-dependencies

    calver-release:
        runs-on: ubuntu-latest
        needs:
            - prebuild
            - test
            - validate-dependencies
        outputs:
            version: ${{ steps.calver.outputs.version }}
            tag: ${{ steps.calver.outputs.tag }}
            changelog: ${{ steps.calver.outputs.changelog }}
        steps:
            - name: Access repository
              uses: actions/checkout@v4
              with:
                  ref: main
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node-version }}

            - name: Bump CalVer, update CHANGELOG, commit and tag
              id: calver
              run: node .github/scripts/calver-release.mjs --commit --tag --github-output "$GITHUB_OUTPUT"

    build:
        runs-on: ubuntu-latest
        needs:
            - calver-release
        steps:
            - name: Access repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.calver-release.outputs.tag }}
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node-version }}

            - name: Enable Corepack
              run: corepack enable

            - name: Set Yarn Version
              run: corepack prepare yarn@${{ env.yarn-version }} --activate

            - name: Get Yarn cache directory
              id: yarn-cache-dir
              run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

            - name: Cache Yarn dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ steps.yarn-cache-dir.outputs.dir }}
                      .yarn/cache
                      .yarn/patches
                      .yarn/plugins
                      .yarn/releases
                      .yarn/sdks
                      .yarn/versions
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Update Lockfile
              run: yarn install --mode=update-lockfile

            - name: Install dependencies
              run: yarn install --mode=skip-build

            - name: Build
              run: yarn build

            - name: Upload client build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ github.event.repository.name }}-client
                  path: client/dist

            - name: Upload server build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ github.event.repository.name }}-server
                  path: server/dist

    build-desktop:
        runs-on: windows-latest
        needs:
            - calver-release
            - build
        steps:
            - name: Access repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.calver-release.outputs.tag }}
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node-version }}

            - name: Enable Corepack
              run: corepack enable

            - name: Set Yarn Version
              run: corepack prepare yarn@${{ env.yarn-version }} --activate

            - name: Get Yarn cache directory
              id: yarn-cache-dir
              run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

            - name: Cache Yarn dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ steps.yarn-cache-dir.outputs.dir }}
                      .yarn/cache
                      .yarn/patches
                      .yarn/plugins
                      .yarn/releases
                      .yarn/sdks
                      .yarn/versions
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - uses: actions/download-artifact@v4
              with:
                  name: ${{ github.event.repository.name }}-client
                  path: client/dist

            - uses: actions/download-artifact@v4
              with:
                  name: ${{ github.event.repository.name }}-server
                  path: server/dist

            - name: Update Lockfile
              run: yarn install --mode=update-lockfile

            - name: Install dependencies
              run: yarn install --mode=skip-build

            - name: Build desktop
              run: yarn build:desktop

            - name: Upload desktop build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ github.event.repository.name }}-desktop
                  path: desktop/dist

    publish-github-release:
        runs-on: ubuntu-latest
        needs:
            - calver-release
            - build-desktop
        steps:
            - name: Access repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.calver-release.outputs.tag }}
                  fetch-depth: 0

            - uses: actions/download-artifact@v4
              with:
                  name: ${{ github.event.repository.name }}-desktop
                  path: desktop/dist

            - name: Compress desktop artifact to zip
              working-directory: desktop/dist
              run: |
                  zip -r "../../${{ github.event.repository.name }}-${{ needs.calver-release.outputs.version }}.zip" .

            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  name: Release ${{ needs.calver-release.outputs.tag }}
                  tag_name: ${{ needs.calver-release.outputs.tag }}
                  body: |
                      ## Docker

                      ```
                      docker pull ghcr.io/${{ github.repository }}:${{ needs.calver-release.outputs.tag }}
                      ```

                      ${{ needs.calver-release.outputs.changelog }}
                  files: |
                      ${{ github.event.repository.name }}-${{ needs.calver-release.outputs.version }}.zip
                      desktop/dist/*.exe
                  # TODO: macOS releases: desktop/dist/*.dmg

    publish-container-image:
        needs:
            - calver-release
            - build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.calver-release.outputs.tag }}
                  persist-credentials: false

            - name: Create the image tags
              id: image-tag
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=${{ needs.calver-release.outputs.tag }}
                      type=raw,value=latest

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  provenance: false
                  labels: ${{ steps.image-tag.outputs.labels }}
                  tags: ${{ steps.image-tag.outputs.tags }}
