name: Publish shared lib

on:
    workflow_call:
        inputs:
            version:
                description: 'Version to publish (defaults to root package.json version)'
                required: false
                type: string
                default: ''
        outputs:
            version:
                description: 'Published package version'
                value: ${{ jobs.publish-shared-lib.outputs.version }}

permissions:
    contents: read
    packages: write

jobs:
    publish-shared-lib:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.prepare.outputs.version }}
        steps:
            - name: Access repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref }}

            - name: Setup Node.js and Yarn
              uses: ./.github/actions/setup-node-yarn

            - name: Install dependencies
              uses: ./.github/actions/yarn-install

            - name: Prepare shared package version
              id: prepare
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  args=(--github-output "$GITHUB_OUTPUT")
                  if [ -n "$VERSION" ]; then
                      args+=(--version "$VERSION")
                  fi
                  node .github/scripts/prepare-shared-publish.mjs "${args[@]}"

            - name: Build shared package
              run: yarn --cwd shared build

            - name: Publish to GitHub Packages
              working-directory: shared
              run: yarn npm publish --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  YARN_NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
