#######################################################################################################################
#
#   Shared Lib Publish (GitHub Packages)
#
#   Manual workflow_dispatch. Builds and publishes the shared lib to GitHub Packages.
#
#######################################################################################################################
name: Publish shared lib (GitHub Packages)

permissions:
    contents: read
    packages: write

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to publish (defaults to root package.json version)'
                required: false
                type: string

jobs:
    publish-shared-lib:
        permissions:
            contents: read
            packages: write
        uses: ./.github/workflows/publish-shared-lib.yml
        with:
            version: ${{ inputs.version }}
            registry-url: https://npm.pkg.github.com
            prepare-publish-args: --set-publish-name
        secrets:
            npm-auth-token: ${{ secrets.GITHUB_TOKEN }}
