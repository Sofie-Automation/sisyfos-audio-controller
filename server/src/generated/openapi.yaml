                  description: 0 = NONE, 1 = PST, 2 = PFL, 3 = CUE_NEXT
                  enum:
                    - 0
                    - 1
                    - 2
                    - 3
                labelControlsIgnoreAutomation:
                  type: boolean
                labelIgnorePrefix:
                  type: string
                pgmOnFollowsMixer:
                  type: integer
                  description: 0 = None, 1 = Global, 2 = Manual, 3 = Auto
                  enum:
                    - 0
                    - 1
                    - 2
                    - 3
                offtubeMode:
                  type: boolean
                enablePages:
                  type: boolean
                numberOfCustomPages:
                  type: integer
                chanStripFollowsPFL:
                  type: boolean
                labelType:
                  type: string
                  enum:
                    - automatic
                    - user
                    - automation
                    - channel
                serverOnline:
                  type: boolean
                  description: Connection state
            examples:
              fadeTimes:
                value:
                  fadeTime: 200
                  voFadeTime: 400
              secondMixerIp:
                value:
                  mixers:
                    - {}
                    - deviceIp: 192.168.1.20
      responses:
        "200":
          description: Success
          content:
            text/plain:
              schema:
                type: string
              example: OK
        "400":
          description: The request was invalid
          content:
            text/plain:
              schema:
                type: string
                title: ErrorMessage
                description: Human-readable error message. Server errors are not detailed; check
                  the server log.
              example: Invalid pages format
        "500":
          description: Unexpected server error
          content:
            text/plain:
              schema:
                type: string
                title: ErrorMessage
                description: Human-readable error message. Server errors are not detailed; check
                  the server log.
              example: Internal server error
  /snapshots:
    get:
      operationId: getSnapshots
      tags:
        - snapshots
      summary: List the saved snapshots
      description: Returns the .shot files in the storage folder. default.shot is left out.
      responses:
        "200":
          description: The snapshot file names
          content:
            application/json:
              schema:
                type: array
                title: SnapshotList
                description: Snapshot file names in the storage folder, excluding default.shot
                items:
                  type: string
                example:
                  - morning-show.shot
                  - evening-news.shot
        "500":
          description: Unexpected server error
          content:
            text/plain:
              schema:
                type: string
                title: ErrorMessage
                description: Human-readable error message. Server errors are not detailed; check
                  the server log.
              example: Internal server error
  "/snapshot/{filename}":
    parameters:
      - name: filename
        in: path
        required: true
        description: Snapshot file name in the storage folder. Any directory part is
          stripped, and .shot is added if missing.
        schema:
          type: string
        example: morning-show.shot
    get:
      operationId: getSnapshot
      tags:
        - snapshots
      summary: Download a snapshot
      responses:
        "200":
          description: The snapshot file, sent as an attachment
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="morning-show.shot"
          content:
            application/octet-stream:
              schema:
                type: string
                title: SnapshotFile
                description: Raw snapshot file contents, a JSON document holding the saved fader
                  and channel state.
                format: binary
        "404":
          description: The file does not exist
          content:
            text/plain:
              schema:
                type: string
                title: ErrorMessage
                description: Human-readable error message. Server errors are not detailed; check
                  the server log.
              example: File not found
    put:
      operationId: putSnapshot
      tags:
        - snapshots
      summary: Upload a snapshot
      description: Creates or overwrites the snapshot (up to 50 MB of JSON) and
        broadcasts the new snapshot list to connected socket.io clients.
        default.shot cannot be written. With load=true the snapshot is also
        loaded in the same request.
      parameters:
        - name: load
          in: query
          required: false
          description: Load the snapshot right after saving it, as POST
            /snapshot/{filename}/load does.
          schema:
            type: boolean
            default: false
        - name: push
          in: query
          required: false
          description: Send the loaded fader levels to the mixers straight away. Without
            it, loading only updates the server state and connected clients, and
            the mixers pick up the change later. Only used when a snapshot is
            loaded.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: Snapshot
              description: Saved fader and channel state. Only the structure below is checked,
                not the other fader and channel fields, so snapshots saved by
                older versions are accepted. The body is stored as-is.
              required:
                - channelState
                - faderState
              properties:
                channelState:
                  type: object
                  required:
                    - chMixerConnection
                  properties:
                    chMixerConnection:
                      type: array
                      description: Channel state for each mixer
                      items:
                        type: object
                        required:
                          - channel
                        properties:
                          channel:
                            type: array
                            items:
                              type: object
                              required:
                                - channelType
                              properties:
                                channelType:
                                  type: number
                                  description: Index of the channel type in the mixer protocol
                faderState:
                  type: object
                  required:
                    - fader
                  properties:
                    fader:
                      type: array
                      description: State of each fader
                      items:
                        type: object
      responses:
        "200":
          description: Success
          content:
            text/plain:
              schema:
                type: string
              example: OK
        "400":
          description: The request was invalid
          content:
            text/plain:
              schema:
                type: string
                title: ErrorMessage
                description: Human-readable error message. Server errors are not detailed; check
                  the server log.
              example: Invalid pages format
        "500":
          description: Unexpected server error
          content:
            text/plain:
              schema:
                type: string
                title: ErrorMessage
                description: Human-readable error message. Server errors are not detailed; check
                  the server log.
              example: Internal server error
  "/snapshot/{filename}/load":
    parameters:
      - name: filename
        in: path
        required: true
        description: Snapshot file name in the storage folder. Any directory part is
          stripped, and .shot is added if missing.
        schema:
          type: string
        example: morning-show.shot
    post:
      operationId: loadSnapshot
      tags:
        - snapshots
      summary: Load a snapshot
      description: Makes the snapshot the active fader and channel state and sends the
        full state to connected socket.io clients.
      parameters:
        - name: push
          in: query
          required: false
          description: Send the loaded fader levels to the mixers straight away. Without
            it, loading only updates the server state and connected clients, and
            the mixers pick up the change later. Only used when a snapshot is
            loaded.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Success
          content:
            text/plain:
              schema:
                type: string
              example: OK
        "404":
          description: The snapshot does not exist or is not a valid snapshot
          content:
            text/plain:
              schema:
                type: string
                title: ErrorMessage
                description: Human-readable error message. Server errors are not detailed; check
                  the server log.
              example: Snapshot not found or invalid
